{% extends 'base.html' %}

{% block title %}Sign In - Tin Tun Store{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card card-custom p-4 p-md-5">
                <div class="text-center mb-4">
                    <h3 class="fw-bold mb-1">Welcome Back</h3>
                    <p class="text-muted small">Sign in to your <b>Tin Tun Store</b> account</p>
                </div>
                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Email Address</label>
                        {{ form.username }}
                    </div>
                    <div class="mb-4">
                        <div class="d-flex justify-content-between align-items-center mb-1">
                            <label class="form-label fw-semibold mb-0">Password</label>
                        </div>
                        {{ form.password }}
                    </div>
                    <button type="submit" class="btn btn-primary-custom w-100 py-3 mb-3">Sign In</button>
                </form>
                <div class="text-center">
                    <p class="text-muted small mb-0">Don't have an account? <a href="{% url 'accounts:register' %}" class="text-primary fw-bold text-decoration-none">Create one</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
