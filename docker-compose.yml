version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: shopflow_postgres
    environment:
      POSTGRES_DB: shopflow_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    container_name: shopflow_web
    command: gunicorn --bind 0.0.0.0:8000 shopflow.wsgi:application
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - SECRET_KEY=django-insecure-shopflow-pro-super-secret-key
      - DB_ENGINE=django.db.backends.postgresql
      - DB_NAME=shopflow_db
      - DB_USER=postgres
      - DB_PASSWORD=postgrespassword
      - DB_HOST=db
      - DB_PORT=5432
    depends_on:
      - db

volumes:
  postgres_data:
